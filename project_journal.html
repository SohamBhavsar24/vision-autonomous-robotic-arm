<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Native iPhone Web App PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arm Journal">
  <meta name="theme-color" content="#FAF7F2">

  <!-- Apple Touch Icon & Favicon (Cache-Busted v=3) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="shortcut icon" href="apple-touch-icon.png?v=3">

  <title>Robotic Arm Project Engineering Journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #FAF7F2;
      --bg-card: #FFFFFF;
      --border-card: #E0D6C8;
      --text-main: #2A2624;
      --text-muted: #66605C;
      --accent-primary: #C4784A;
      --accent-danger: #D9534F;
      --font-heading: 'DM Serif Display', Georgia, serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.7;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(40px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
    }

    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--border-card);
      padding-bottom: 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-text {
      flex: 1;
    }

    .journal-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .journal-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Search Bar Box */
    .search-box {
      margin-bottom: 28px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(42, 38, 36, 0.02);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 12px rgba(196, 120, 74, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Journal Entry Card */
    .journal-entry {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 4px 12px rgba(42, 38, 36, 0.03);
      position: relative;
    }

    .entry-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .entry-date {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .entry-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-card);
    }

    .entry-footer-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .entry-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
    }

    .edit-btn {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      background: #FAF7F2;
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      color: var(--accent-primary);
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      line-height: 1.2;
    }

    .edit-btn:hover, .edit-btn:active {
      color: #9c582f;
      background: #F4EFE6;
      border-color: var(--accent-primary);
    }

    .delete-btn {
      font-size: 0.95rem;
      background: #FAF7F2;
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1.2;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }

    .delete-btn:hover, .delete-btn:active {
      background: #FDF2F2;
      border-color: var(--accent-danger);
      transform: scale(1.08);
    }

    .btn-read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 0;
      background: #F4EFE6;
      border: 1px solid var(--border-card);
      border-radius: 6px;
      padding: 5px 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-primary);
      cursor: pointer;
      transition: all 0.15s ease;
      line-height: 1.2;
    }

    .btn-read-more:hover {
      background: #EFE6D8;
      border-color: var(--accent-primary);
    }

    mark.search-highlight {
      background: rgba(196, 120, 74, 0.28);
      color: #6A3212;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
      border: 1px solid rgba(196, 120, 74, 0.4);
    }

    .entry-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .entry-content p {
      margin-bottom: 14px;
      font-size: 1rem;
      color: #383330;
    }

    .entry-content p:last-child {
      margin-bottom: 0;
    }

    /* File Attachment Styling */
    .attachment-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-card);
    }

    .attachment-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F4EFE6;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-family: var(--font-mono);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .attachment-badge:hover {
      background: #EFE6D8;
    }

    .attachment-media-video {
      width: 100%;
      max-height: 380px;
      border-radius: 10px;
      margin-top: 12px;
      background: #000;
    }

    .attachment-media-img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid var(--border-card);
    }

    .btn {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-secondary {
      background: #EFE8DE;
      color: var(--text-main);
      border: 1px solid var(--border-card);
    }

    .btn:active {
      opacity: 0.8;
    }

    /* Floating iPhone + Button */
    .fab-btn {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom));
      right: max(24px, env(safe-area-inset-right));
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: white;
      border: none;
      font-size: 2.2rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(196, 120, 74, 0.45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(42, 38, 36, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 650px;
      padding: 28px;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.15);
      animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (min-width: 600px) {
      .modal-card {
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 14px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text-main);
    }

    .form-textarea {
      height: 160px;
      resize: vertical;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-card);
      border-radius: 14px;
    }

    @media print {
      body { background: white; padding: 0; }
      .header-btns, .search-box, .fab-btn, .modal-overlay, .delete-btn, .edit-btn, .btn-read-more, .entry-footer { display: none !important; }
      .entry-content-full { display: block !important; }
      .entry-content-preview { display: none !important; }
      .journal-entry { border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-text">
        <h1 class="journal-title">Project Journal</h1>
        <div class="journal-subtitle">Vision-Based Autonomous Pick-and-Place Robotic Arm</div>
      </div>
      <div class="header-btns">
        <button class="btn" onclick="window.print()">Print / PDF</button>
      </div>
    </header>

    <!-- Header Search Bar -->
    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Search..." style="padding-left: 16px;">
    </div>

    <main id="journalContainer">
      <!-- Entries render dynamically -->
    </main>
  </div>

  <!-- Floating iPhone + Button -->
  <button class="fab-btn" id="btnOpenModal" title="Add Journal Entry">+</button>

  <!-- Add / Edit Entry Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 class="modal-title" id="modalTitle">New Journal Entry</h2>
      
      <form id="journalForm">
        <input type="hidden" id="editEntryId" value="">

        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="text" class="form-input" id="inputDate" style="font-family: var(--font-mono); color: var(--accent-primary); font-weight: 600;">
        </div>

        <div class="form-group">
          <label class="form-label">Header Title (Optional)</label>
          <input type="text" class="form-input" id="inputTitle" placeholder="e.g. Physical Workspace Geometry & Dual-Frame Calibration Decision">
        </div>

        <div class="form-group">
          <label class="form-label">Journal Narrative Story</label>
          <textarea class="form-textarea" id="inputText" placeholder="Write detailed session narrative..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Attach PDF, Word Doc, Photo, or Video (Optional)</label>
          <div id="currentAttachmentInfo" style="font-size: 0.82rem; color: var(--accent-primary); margin-bottom: 6px; display: none; font-family: var(--font-mono); font-weight: 600;"></div>
          <input type="file" class="form-input" id="inputFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm">
          <div id="fileUploadStatus" style="font-size: 0.82rem; color: var(--accent-primary); margin-top: 6px; display: none;"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCloseModal">Cancel</button>
          <button type="submit" class="btn" id="btnSubmitForm">Submit Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Seed Journal Entries
    const DEFAULT_ENTRIES = [
      {
        id: "entry-18",
        date: "Thursday, 1st October 2026",
        title: "Action Chunking with Transformers (ACT) Policy Pipeline, Feature Dimensionality (With vs Without Theta) & Descent-Apex Grasp Synchronization",
        paragraphs: [
          "In today's session, we achieved a significant breakthrough in physical grasp execution and multi-step policy architecture. During initial physical rollouts of our decoupled pick policy, we observed that while the arm approached target blocks along correct spatial vectors, the downward grasp dip (elbow extension) occasionally flattened, failing to plunge deeply enough to secure the block. Diagnosing the joint-space trajectory synthesis, we found that naive step-wise Inverse Distance Weighting (IDW) blending smoothed out the sharp elbow dip apex because human demonstration episodes varied in duration. To eliminate this issue without resorting to synthetic spatial offsets, we engineered Two-Stage Phase-Aligned IDW Blending. By partitioning demonstrations into approach, dip apex, and lift phases and synchronizing their temporal boundaries prior to manifold blending, the synthesized trajectories preserve the true physical downward dip depth and curvature.",
          "Next, we conducted a systematic feature dimensionality ablation investigating the role of block orientation theta. The 4cm sponge cubes exhibit 4-fold rotational symmetry (90° invariance). We discovered that high-frequency optical ArUco theta jitter from the overhead camera induced unnecessary wrist roll (theta 5) corrections, destabilizing vertical gripper alignment and degrading plunge depth. To address this, we upgraded train_policy_engine.py with an include_theta toggle and trained excluding_block_theta, an 8-dimensional observation model ([theta 1..theta 5, gripper, X, Y]). Training converged in 3.61 seconds with a loss of 0.3668 (Joint MSE: 0.2876). Physical validation confirmed that eliminating theta noise substantially stabilized end-effector approach and produced noticeably higher physical grasp acquisition rates on the workspace board.",
          "To address compound covariate shift and eliminate single-step Markovian trajectory errors, we designed and implemented a self-contained, zero-dependency Action Chunking with Transformers (ACT) pipeline directly in pure NumPy (train_act_engine.py). Tailored for low-power edge deployment on hardware like the Raspberry Pi 5, the model architecture incorporates Multi-Head Self-Attention (4 heads, d_model=64, d_k=16, d_v=16, d_ff=128), learned sinusoidal temporal query embeddings for a prediction horizon of H=24 steps (0.8s lookahead at 30Hz), and dual linear heads for joint angles (MSE) and gripper state (BCE). By flattening 3D attention tensors into contiguous 2D matrices and dispatching directly to Apple Accelerate BLAS (cblas_sgemm via np.dot), we achieved a 32.6x training speedup, reducing epoch times from 160s to 4.9s. We formatted the dataset into 10,244 chunked rolling pairs (O_t, A_{t:t+24}) and trained both act_no_theta (8 dims, Best Loss: 17.8150, Joint MSE: 17.3032, ~4.16° RMSE across 24 steps) and act_with_theta (9 dims, Best Loss: 16.5912, Joint MSE: 16.0755, ~4.01° RMSE across 24 steps). We integrated ACT into autonomous_runner.py with Receding Horizon Temporal Ensembling (w_k = exp(-0.05 * k)) across overlapping predictions for zero-jerk execution.",
          "Finally, we diagnosed and resolved a critical physical rollout timing bug where the ACT model guided the arm to the exact block coordinates but failed to close the claw, instead closing in mid-air at the drop bin. Analyzing demonstration frame statistics revealed an 85% to 15% open-vs-closed class imbalance. Unweighted binary cross-entropy heavily penalized false-positive closures, suppressing sigmoid probabilities to ~0.01-0.05 and preventing the policy from crossing the 0.50 grasp threshold during the brief contact window. The autonomous runner then entered Phase 3 assuming the block was grasped, closing the gripper at the drop bin. We resolved this by implementing Descent-Apex Grasp Detection in rollout_act_trajectory(): the system tracks elbow extension and automatically triggers grip closure when the arm reaches the downward descent apex (Elbow >= 154° or descent rate plateaus after >= 35 approach frames). The claw locks securely, holds for 30 lift frames, and transitions smoothly into Phase 3 deterministic drop. This completes the core experimental foundation for our journal paper comparative matrix evaluating single-step MLPs (H=1) against Action Chunking Transformers (H=24) across 30, 60, and 90 demonstrations."
        ],
        attachment: null
      },
      {
        id: "entry-17",
        date: "Sunday, 27th September 2026",
        title: "Decoupled Pick-Only Imitation Learning Architecture, Spatial Obstacle Clearing & Continuous Workspace Radar",
        paragraphs: [
          "In today's session, we completed a major consolidation of our perception architecture by formally retiring the redundant Camera Feeds panel and elevating our computer vision subsystem into a unified Perception panel (panel-perception). With the wrist/side camera (Camera 2) permanently canceled, all operations are streamlined around our overhead Logitech C270 sensor (Camera 1) running 30 FPS OpenCV ArUco tracking. We engineered an interactive 2D SVG Workspace Radar mapping the continuous 30cm x 25cm manipulation pad in an exact 6:5 (1.20:1) physical aspect ratio, featuring real-time coordinate axes (+X red, +Y green), moving target puck with orientation vector theta, and digital coordinate telemetry cards. In the 3D WebGL Digital Twin, we refined the flight navigation HUD to start collapsed by default upon server boot and hard refresh, keeping the CAD viewport clean.",
          "During an in-depth review of our first 30 human teleoperation demonstrations, we identified that while visual block acquisition was accurately captured, swinging the arm to the left to drop blocks introduced significant multimodal variance in release positions and heights. In Behavioral Cloning and Action Chunking, this variance leads to trajectory averaging and inconsistent drop heights. To resolve this, we formulated a decoupled task decomposition: the neural policy (BC or ACT) exclusively learns the vision-guided pick sequence (Home -> Approach -> Align theta -> Descend -> Grasp -> Lift to clearance), while the place phase is delegated to a deterministic, zero-jerk Cosine S-Curve trajectory moving to calibrated, persistent drop coordinates (drop_locations.json). For Action Chunking with Transformers (ACT), this reduces trajectory length from ~300 steps down to ~60-90 monotonic steps, eliminating trajectory reversals and accelerating model convergence.",
          "For multi-block sorting with Block 1 (Tag 0) and Block 2 (Tag 1) simultaneously in the workspace, we devised a proximity-based spatial sweep rule. Because drop containers are positioned outside the workspace to the left (in the +X lateral direction), the autonomous scheduler prioritizes picking the block with the higher X coordinate first. By clearing the downstream object nearest the drop zone first, the subsequent block transfer traverses an entirely vacant table, mathematically eliminating block-on-block collisions without requiring exaggerated clearance heights. Finally, we codified a strict architectural mandate: the Servo Control panel (Servo 5 card) is the sole authoritative source of truth for the dynamic Gripper Open Angle (persisted in localStorage and kinematics_config.json). Hardcoded 140° gripper angles are strictly eliminated; all homing routines, autonomous standbys, and drop pose releases dynamically execute the active user-calibrated openAngle."
        ],
        attachment: null
      },
      {
        id: "entry-16",
        date: "Saturday, 26th September 2026",
        title: "Continuous Autonomous Mode Redesign (Before vs After) & Three.js 3D Mesh Table Penetration Prevention",
        paragraphs: [
          "In today's session, we completely overhauled the Autonomous Mode execution flow to prepare for our upcoming journal paper evaluation trials. In our previous Phase D implementation, each registered policy model (v1, v2, v3) had an individual manual launch button on the UI card, requiring the operator to manually click 'Start Autonomous Pick & Place' each time a block was placed. Furthermore, the previous system lacked perception stability verification, meaning placing a block by hand could prematurely trigger execution mid-placement, and having the drop box within camera view risked false duplicate picks.",
          "We resolved these bottlenecks by building a unified Continuous Autonomous Execution Engine featuring a Master Control Bar with a dynamic model selector dropdown and single Start/Stop toggle button. The arm now parks in a safe Standby pose at Home ([90°, 90°, 90°, 90°, 90°, openAngle]) while continuously monitoring the 25cm x 30cm manipulation pad via Camera 1. When a target block (ArUco ID 0) is placed, the system automatically initiates a 1.0-second stationary stability countdown (Δx ≤ 0.8 cm, Δy ≤ 0.8 cm, Δθ ≤ 15°). Any human hand movement or block displacement instantly resets the countdown. Once 1.0s stability is verified, the selected policy rolls out the 30Hz trajectory, deposits the block into the target box, smoothly returns to Home, and immediately re-enters Standby ready for the next block. The overhead camera field-of-view is strictly decoupled from the drop location, permanently eliminating duplicate pick triggers.",
          "To solve the physical issue of the robotic arm and gripper occasionally slamming into the workspace table during manual teleoperation and autonomous rollouts, we implemented a 100% Digital Twin-based Table Penetration Prevention and Safe Revert Geofencing system. In strict compliance with our project's core research philosophy, this solution operates with ZERO complex analytical kinematics equations. Instead, it tests candidate joint angles on the Three.js 3D scene-graph groups off-screen, computes the exact world elevation (Y_min in mm) of the gripper claws via THREE.Box3().setFromObject(this.wristPitchGroup), and compares it against an 8.0 mm safety floor threshold above the tabletop (table wood at Y = 0 mm, calibrated pad at Y = 1.6 mm, leaving a 6.4 mm air cushion).",
          "This safety guard is universally enforced across manual sliders, PS5 DualSense teleoperation (intercepted pre-flight in throttledSendAngles()), and live autonomous mode execution. If candidate angles command claws below 8.0 mm, transmission is blocked, a flashing crimson HUD banner ('TABLE PENETRATION DETECTED: REVERTED TO SAFE POSE') alerts the operator, colliding claws highlight in red, and the arm is held at the last safe pose. We updated all safe fallbacks to dynamically resolve the user's calibrated gripper openAngle rather than hardcoding 140°, and added a header toggle button ('Table Safety: OFF' by default, toggleable to 'ON') with browser localStorage persistence to provide full operator control."
        ]
      },
      {
        id: "entry-15",
        date: "Sunday, 20th September 2026",
        title: "3D WebGL Digital Twin Simulation Engine (Three.js) & Dedicated ROS 2 Architecture",

    function getOrdinalSuffix(day) {
      if (day > 3 && day < 21) return 'th';
      switch (day % 10) {
        case 1:  return 'st';
        case 2:  return 'nd';
        case 3:  return 'rd';
        default: return 'th';
      }
    }

    function formatExactDate(d = new Date()) {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      
      const dayName = days[d.getDay()];
      const dayNum = d.getDate();
      const monthName = months[d.getMonth()];
      const year = d.getFullYear();

      const padDay = dayNum < 10 ? `0${dayNum}` : `${dayNum}`;
      return `${dayName}, ${padDay}${getOrdinalSuffix(dayNum)} ${monthName} ${year}`;
    }

    function parseEntryTimestamp(entry) {
      if (!entry) return 0;
      let baseTs = 0;
      if (entry.date) {
        const cleanDate = entry.date.replace(/(\d+)(st|nd|rd|th)/, '$1');
        const ts = Date.parse(cleanDate);
        if (!isNaN(ts)) baseTs = ts;
      }
      if (entry.id && typeof entry.id === 'string' && entry.id.startsWith('entry-')) {
        const num = parseInt(entry.id.replace('entry-', ''), 10);
        if (!isNaN(num)) {
          // Timestamp-based IDs (like entry-1786125467391) take absolute priority for real-time sorting
          if (num > 1000000000000) return num;
          return baseTs + num;
        }
      }
      return baseTs;
    }

    function sortEntriesDatewise(entries) {
      if (!Array.isArray(entries)) return [];
      return [...entries].sort((a, b) => {
        const tsA = parseEntryTimestamp(a);
        const tsB = parseEntryTimestamp(b);
        if (tsB !== tsA) return tsB - tsA;
        return String(b.id || '').localeCompare(String(a.id || ''));
      });
    }

    function getStoredEntries() {
      let result = DEFAULT_ENTRIES;
      const saved = localStorage.getItem('robotic_arm_journal_entries');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) result = parsed;
        } catch (e) {}
      }
      return sortEntriesDatewise(result);
    }

    async function syncBackendJournal() {
      const targets = [
        '/api/journal',
        'https://vision-autonomous-robotic-arm.vercel.app/api/journal',
        'dashboard/backend/journal_entries.json'
      ];
      for (const t of targets) {
        try {
          const res = await fetch(t);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
              const map = new Map();
              DEFAULT_ENTRIES.forEach(e => map.set(e.id, e));
              getStoredEntries().forEach(e => map.set(e.id, e));
              data.forEach(e => map.set(e.id, e));

              const mergedSorted = sortEntriesDatewise(Array.from(map.values()));
              const currentRaw = localStorage.getItem('robotic_arm_journal_entries');
              if (currentRaw !== JSON.stringify(mergedSorted)) {
                localStorage.setItem('robotic_arm_journal_entries', JSON.stringify(mergedSorted));
                renderJournal();
              }
              break;
            }
          }
        } catch (e) {}
      }
    }

    async function deleteEntry(id) {
      if (confirm("Are you sure you want to delete this journal entry?")) {
        let entries = getStoredEntries();
        entries = entries.filter(e => e.id !== id);
        localStorage.setItem('robotic_arm_journal_entries', JSON.stringify(entries));
        renderJournal();

        // Delete from backend API proxy
        const delTargets = [
          `/api/journal?id=${encodeURIComponent(id)}`,
          `https://vision-autonomous-robotic-arm.vercel.app/api/journal?id=${encodeURIComponent(id)}`
        ];
        for (const dt of delTargets) {
          try {
            const res = await fetch(dt, { method: 'DELETE' });
            if (res.ok) break;
          } catch (e) {}
        }

        await saveEntries(entries);
      }
    }

    async function saveEntries(entries) {
      try {
        localStorage.setItem('robotic_arm_journal_entries', JSON.stringify(entries));
      } catch (err) {}

      // Normalize array keys for journal persistence
      const normalized = entries.map(item => ({
        id: item.id,
        date: item.date,
        title: item.title,
        paragraphs: item.paragraphs || [],
        attachment: item.attachment || null
      }));

      const targets = [
        '/api/journal',
        'https://vision-autonomous-robotic-arm.vercel.app/api/journal'
      ];
      for (const t of targets) {
        try {
          const res = await fetch(t, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(normalized)
          });
          if (res.ok) break;
        } catch (e) {}
      }
    }

    async function triggerDownloadAttachment(entryId, filename, defaultUrl) {
      let targetUrl = defaultUrl || 'robotic_arm_synopsis.pdf';
      try {
        // Fetch blob for cross-origin Supabase / remote media URLs so browser triggers direct download
        const res = await fetch(targetUrl);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'media_file';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
      } catch (e) {
        const a = document.createElement('a');
        a.href = targetUrl;
        a.download = filename || 'media_file';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }

    function highlightText(text, query) {
      if (!query || !text) return text;
      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQuery})`, 'gi');
      return text.replace(regex, '<mark class="search-highlight">$1</mark>');
    }

    function countTotalWords(paragraphs) {
      if (!Array.isArray(paragraphs)) return 0;
      return paragraphs.reduce((sum, p) => sum + (p ? p.trim().split(/\s+/).filter(Boolean).length : 0), 0);
    }

    function create100WordPreview(paragraphs) {
      let wordsNeeded = 100;
      const previewParas = [];
      for (const p of paragraphs) {
        const words = p.trim().split(/\s+/).filter(Boolean);
        if (words.length <= wordsNeeded) {
          previewParas.push(words.join(' '));
          wordsNeeded -= words.length;
          if (wordsNeeded <= 0) break;
        } else {
          previewParas.push(words.slice(0, wordsNeeded).join(' ') + '...');
          wordsNeeded = 0;
          break;
        }
      }
      return previewParas;
    }

    const expandedEntryIds = new Set();

    function toggleEntryExpand(id) {
      if (expandedEntryIds.has(id)) {
        expandedEntryIds.delete(id);
      } else {
        expandedEntryIds.add(id);
      }
      const preview = document.getElementById(`preview-${id}`);
      const full = document.getElementById(`full-${id}`);
      const btn = document.getElementById(`btnExpand-${id}`);
      const isExp = expandedEntryIds.has(id);
      if (preview && full) {
        preview.style.display = isExp ? 'none' : 'block';
        full.style.display = isExp ? 'block' : 'none';
      }
      if (btn) {
        btn.innerHTML = isExp ? 'Read Less &#9652;' : 'Read More &#9662;';
      }
    }

    function renderJournal() {
      const container = document.getElementById('journalContainer');
      const entries = getStoredEntries();
      const query = document.getElementById('searchInput').value.trim();
      const queryLower = query.toLowerCase();

      const filtered = entries.filter(item => {
        if (!queryLower) return true;
        const matchTitle = item.title.toLowerCase().includes(queryLower);
        const matchDate = item.date.toLowerCase().includes(queryLower);
        const matchContent = item.paragraphs.some(p => p.toLowerCase().includes(queryLower));
        const matchAttachment = item.attachment && item.attachment.name.toLowerCase().includes(queryLower);
        return matchTitle || matchDate || matchContent || matchAttachment;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">No journal entries found matching "${query}"</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const totalWords = countTotalWords(item.paragraphs);
        const isLong = totalWords > 100;
        
        // Auto-expand if search query matches full content
        if (queryLower && item.paragraphs.some(p => p.toLowerCase().includes(queryLower))) {
          expandedEntryIds.add(item.id);
        }
        
        const isExpanded = expandedEntryIds.has(item.id);

        let contentBlock = '';
        if (!isLong) {
          contentBlock = `
            <div class="entry-content">
              ${item.paragraphs.map(p => `<p>${highlightText(p, query)}</p>`).join('')}
            </div>
          `;
        } else {
          const previewParas = create100WordPreview(item.paragraphs);
          contentBlock = `
            <div class="entry-content">
              <div class="entry-content-preview" id="preview-${item.id}" style="display: ${isExpanded ? 'none' : 'block'};">
                ${previewParas.map(p => `<p>${highlightText(p, query)}</p>`).join('')}
              </div>
              <div class="entry-content-full" id="full-${item.id}" style="display: ${isExpanded ? 'block' : 'none'};">
                ${item.paragraphs.map(p => `<p>${highlightText(p, query)}</p>`).join('')}
              </div>
              <button type="button" class="btn-read-more" id="btnExpand-${item.id}" onclick="toggleEntryExpand('${item.id}')">
                ${isExpanded ? 'Read Less &#9652;' : 'Read More &#9662;'}
              </button>
            </div>
          `;
        }

        return `
          <article class="journal-entry" id="card-${item.id}">
            <div class="entry-header-row">
              <div class="entry-date">${highlightText(item.date, query)}</div>
              <div class="entry-actions">
                <button class="edit-btn" onclick="openEditModal('${item.id}')" title="Edit Entry">Edit</button>
                <button class="delete-btn" onclick="deleteEntry('${item.id}')" title="Delete Entry">Delete</button>
              </div>
            </div>
            <h2 class="entry-title">${highlightText(item.title, query)}</h2>
            ${contentBlock}
            ${renderAttachment(item.attachment, item.id)}
          </article>
        `;
      }).join('');
    }

    // Live Search Event Listener
    document.getElementById('searchInput').addEventListener('input', renderJournal);

    // Modal Control
    const modalOverlay = document.getElementById('modalOverlay');
    const btnOpenModal = document.getElementById('btnOpenModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const inputDate = document.getElementById('inputDate');
    const journalForm = document.getElementById('journalForm');

    function openEditModal(id) {
      const entries = getStoredEntries();
      const entry = entries.find(e => e.id === id);
      if (!entry) return;

      document.getElementById('editEntryId').value = entry.id;
      const modalTitle = document.getElementById('modalTitle');
      if (modalTitle) modalTitle.textContent = 'Edit Journal Entry';

      inputDate.value = entry.date || formatExactDate();
      document.getElementById('inputTitle').value = entry.title || '';
      document.getElementById('inputText').value = (entry.paragraphs || []).join('\n\n');

      const submitBtn = document.getElementById('btnSubmitForm') || journalForm.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.textContent = 'Save Changes';

      const attInfo = document.getElementById('currentAttachmentInfo');
      if (attInfo) {
        if (entry.attachment && entry.attachment.name) {
          attInfo.style.display = 'block';
          attInfo.textContent = `Attached: ${entry.attachment.name} (upload below to replace)`;
        } else {
          attInfo.style.display = 'none';
          attInfo.textContent = '';
        }
      }

      const fileInput = document.getElementById('inputFile');
      if (fileInput) fileInput.value = '';
      const statusDiv = document.getElementById('fileUploadStatus');
      if (statusDiv) statusDiv.style.display = 'none';

      modalOverlay.style.display = 'flex';
    }

    btnOpenModal.addEventListener('click', () => {
      document.getElementById('editEntryId').value = '';
      const modalTitle = document.getElementById('modalTitle');
      if (modalTitle) modalTitle.textContent = 'New Journal Entry';

      inputDate.value = formatExactDate();
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputText').value = '';

      const submitBtn = document.getElementById('btnSubmitForm') || journalForm.querySelector('button[type="submit"]');
      if (submitBtn) submitBtn.textContent = 'Submit Entry';

      const attInfo = document.getElementById('currentAttachmentInfo');
      if (attInfo) {
        attInfo.style.display = 'none';
        attInfo.textContent = '';
      }

      const fileInput = document.getElementById('inputFile');
      if (fileInput) fileInput.value = '';
      const statusDiv = document.getElementById('fileUploadStatus');
      if (statusDiv) statusDiv.style.display = 'none';

      modalOverlay.style.display = 'flex';
    });

    btnCloseModal.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = 'none';
    });

    async function compressVideoFile(file) {
      if (!file || !file.type.startsWith('video/')) return file;
      const sizeMB = file.size / (1024 * 1024);
      if (sizeMB <= 15) return file; // Already small enough for direct upload

      const statusDiv = document.getElementById('fileUploadStatus');
      if (statusDiv) {
        statusDiv.style.display = 'block';
        statusDiv.textContent = `Optimizing ${sizeMB.toFixed(0)}MB video to <15MB web format... Please wait a moment.`;
      }

      return new Promise((resolve) => {
        let isDone = false;
        const cleanup = (result) => {
          if (!isDone) {
            isDone = true;
            resolve(result);
          }
        };

        try {
          const video = document.createElement('video');
          video.muted = true;
          video.playsInline = true;
          video.preload = 'auto';
          const url = URL.createObjectURL(file);
          video.src = url;

          video.onloadedmetadata = () => {
            let width = video.videoWidth || 1280;
            let height = video.videoHeight || 720;
            if (height > 720) {
              width = Math.round((width * 720) / height);
              height = 720;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const stream = canvas.captureStream(30);
            let mimeType = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4';
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) mimeType = 'video/webm;codecs=vp8';

            // Lower target bitrate to 1.0 Mbps for large >100MB source files
            const targetBitrate = sizeMB > 100 ? 1000000 : 1500000;
            const recorder = new MediaRecorder(stream, {
              mimeType: mimeType,
              videoBitsPerSecond: targetBitrate
            });

            const chunks = [];
            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
              URL.revokeObjectURL(url);
              const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
              const blob = new Blob(chunks, { type: mimeType });
              const compressed = new File([blob], file.name.replace(/\.[^/.]+$/, '') + `_opt.${ext}`, { type: mimeType });
              cleanup(compressed);
            };

            recorder.start();
            try { video.playbackRate = 2.0; } catch (e) {}
            video.currentTime = 0;
            video.play().catch(() => cleanup(file));

            function anim() {
              if (video.paused || video.ended) {
                if (recorder.state === 'recording') recorder.stop();
                return;
              }
              ctx.drawImage(video, 0, 0, width, height);
              requestAnimationFrame(anim);
            }
            anim();
          };

          video.onerror = () => {
            URL.revokeObjectURL(url);
            cleanup(file);
          };

          // 45-second timeout for loading heavy 285MB video metadata
          setTimeout(() => {
            if (!isDone && video.readyState < 2) {
              console.warn('Video compression load timeout, proceeding with original...');
              cleanup(file);
            }
          }, 45000);

        } catch (err) {
          cleanup(file);
        }
      });
    }

    // Handle Form Submit for Text & Media Log Entries (0.1s instant cloud sync)
    journalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editingId = document.getElementById('editEntryId').value;
      const date = inputDate.value.trim() || formatExactDate();
      let title = document.getElementById('inputTitle').value.trim();
      const rawText = document.getElementById('inputText').value.trim();
      const fileInput = document.getElementById('inputFile');
      const submitBtn = document.getElementById('btnSubmitForm') || journalForm.querySelector('button[type="submit"]');

      if (!title) {
        title = 'Engineering Progress & Decision Updates';
      }

      const paragraphs = rawText.split('\n\n').map(p => p.trim()).filter(p => p.length > 0);

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = editingId ? 'Saving Changes...' : 'Saving Entry & Uploading Media...';
      }

      let existingAttachment = null;
      if (editingId) {
        const curEntries = getStoredEntries();
        const found = curEntries.find(e => e.id === editingId);
        if (found) existingAttachment = found.attachment || null;
      }

      let attachment = existingAttachment;
      if (fileInput && fileInput.files.length > 0) {
        let file = fileInput.files[0];
        
        // Auto-compress large videos (>15MB) in browser for fast, reliable cloud uploads
        if (file.type.startsWith('video/')) {
          file = await compressVideoFile(file);
        }

        const statusDiv = document.getElementById('fileUploadStatus');
        if (statusDiv) {
          statusDiv.style.display = 'block';
          statusDiv.textContent = `Uploading ${file.name}...`;
        }

        try {
          const fileExt = file.name.split('.').pop().toLowerCase();
          const formData = new FormData();
          formData.append('file', file);

          const uploadTargets = [
            '/api/upload',
            'https://vision-autonomous-robotic-arm.vercel.app/api/upload'
          ];
          for (const ut of uploadTargets) {
            try {
              const apiRes = await fetch(ut, { method: 'POST', body: formData });
              if (apiRes.ok) {
                const apiData = await apiRes.json();
                if (apiData && apiData.url) {
                  attachment = { name: file.name, type: fileExt, url: apiData.url };
                  break;
                }
              }
            } catch (err) {}
          }
        } catch (uploadErr) {
          console.warn('Media upload exception:', uploadErr);
        }
      }

      let entries = getStoredEntries();

      if (editingId) {
        const idx = entries.findIndex(e => e.id === editingId);
        const updatedEntry = {
          id: editingId,
          date,
          title,
          paragraphs,
          attachment
        };

        if (idx !== -1) {
          entries[idx] = updatedEntry;
        } else {
          entries.unshift(updatedEntry);
        }

        await saveEntries(entries);
      } else {
        const newEntry = {
          id: `entry-${Date.now()}`,
          date,
          title,
          paragraphs,
          attachment
        };

        entries.unshift(newEntry);
        await saveEntries(entries);
      }

      renderJournal();
      await syncBackendJournal();

      if (fileInput) fileInput.value = '';
      const statusDiv = document.getElementById('fileUploadStatus');
      if (statusDiv) statusDiv.style.display = 'none';

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Entry';
      }
      document.getElementById('editEntryId').value = '';
      modalOverlay.style.display = 'none';
    });

    // Auto-Sync when app is opened or brought to foreground
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        syncBackendJournal();
      }
    });

    window.addEventListener('focus', () => {
      syncBackendJournal();
    });

    renderJournal();
    syncBackendJournal();
    setInterval(syncBackendJournal, 3000);
  </script>
</body>
</html>
