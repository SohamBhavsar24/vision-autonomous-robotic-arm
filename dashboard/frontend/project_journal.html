<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Native iPhone Web App PWA Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arm Journal">
  <meta name="theme-color" content="#FAF7F2">

  <!-- Apple Touch Icon & Favicon (Cache-Busted v=3) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="shortcut icon" href="apple-touch-icon.png?v=3">

  <title>Robotic Arm Project Engineering Journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-page: #FAF7F2;
      --bg-card: #FFFFFF;
      --border-card: #E0D6C8;
      --text-main: #2A2624;
      --text-muted: #66605C;
      --accent-primary: #C4784A;
      --accent-danger: #D9534F;
      --font-heading: 'DM Serif Display', Georgia, serif;
      --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.7;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(60px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      border-bottom: 2px solid var(--border-card);
      padding-bottom: 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-text {
      flex: 1;
    }

    .journal-title {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .journal-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Search Bar Box */
    .search-box {
      margin-bottom: 28px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid var(--border-card);
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(42, 38, 36, 0.02);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 4px 12px rgba(196, 120, 74, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Journal Entry Card */
    .journal-entry {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 4px 12px rgba(42, 38, 36, 0.03);
      position: relative;
    }

    .entry-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .entry-date {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--accent-primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .delete-btn:hover, .delete-btn:active {
      color: var(--accent-danger);
      background: #FDF2F2;
    }

    .entry-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .entry-content p {
      margin-bottom: 14px;
      font-size: 1rem;
      color: #383330;
    }

    .entry-content p:last-child {
      margin-bottom: 0;
    }

    /* File Attachment Styling */
    .attachment-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-card);
    }

    .attachment-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F4EFE6;
      border: 1px solid var(--border-card);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-family: var(--font-mono);
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .attachment-badge:hover {
      background: #EFE6D8;
    }

    .attachment-media-video {
      width: 100%;
      max-height: 380px;
      border-radius: 10px;
      margin-top: 12px;
      background: #000;
    }

    .attachment-media-img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 12px;
      border: 1px solid var(--border-card);
    }

    .btn {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--font-body);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-secondary {
      background: #EFE8DE;
      color: var(--text-main);
      border: 1px solid var(--border-card);
    }

    .btn:active {
      opacity: 0.8;
    }

    /* Floating iPhone + Button */
    .fab-btn {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom));
      right: max(24px, env(safe-area-inset-right));
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-primary);
      color: white;
      border: none;
      font-size: 2.2rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(196, 120, 74, 0.45);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .fab-btn:active {
      transform: scale(0.92);
    }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(42, 38, 36, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: flex-end;
      justify-content: center;
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center;
        padding: 20px;
      }
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 650px;
      padding: 28px;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.15);
      animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      max-height: 90vh;
      overflow-y: auto;
    }

    @media (min-width: 600px) {
      .modal-card {
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-title {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .form-input, .form-textarea {
      width: 100%;
      background: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 14px;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--text-main);
    }

    .form-textarea {
      height: 160px;
      resize: vertical;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      background: var(--bg-card);
      border: 1px dashed var(--border-card);
      border-radius: 14px;
    }

    @media print {
      body { background: white; padding: 0; }
      .header-btns, .search-box, .fab-btn, .modal-overlay, .delete-btn { display: none !important; }
      .journal-entry { border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-text">
        <h1 class="journal-title">Project Journal</h1>
        <div class="journal-subtitle">Vision-Based Autonomous Pick-and-Place Robotic Arm</div>
      </div>
      <div class="header-btns">
        <button class="btn" onclick="window.print()">Print / PDF</button>
      </div>
    </header>

    <!-- Header Search Bar -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Search entries by title or content (e.g. 'synopsis', 'calibration')...">
    </div>

    <main id="journalContainer">
      <!-- Entries render dynamically -->
    </main>
  </div>

  <!-- Floating iPhone + Button -->
  <button class="fab-btn" id="btnOpenModal" title="Add Journal Entry">+</button>

  <!-- Add Entry Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 class="modal-title">New Journal Entry</h2>
      
      <form id="journalForm">
        <div class="form-group">
          <label class="form-label">Auto-Detected Live Date</label>
          <input type="text" class="form-input" id="inputDate" readonly style="font-family: var(--font-mono); color: var(--accent-primary); font-weight: 600;">
        </div>

        <div class="form-group">
          <label class="form-label">Header Title (Optional)</label>
          <input type="text" class="form-input" id="inputTitle" placeholder="e.g. Physical Workspace Geometry & Dual-Frame Calibration Decision">
        </div>

        <div class="form-group">
          <label class="form-label">Journal Narrative Story</label>
          <textarea class="form-textarea" id="inputText" placeholder="Write detailed session narrative..." required></textarea>
        </div>

        <!-- Optional File Attachment Input -->
        <div class="form-group">
          <label class="form-label">Attach File (Optional Synopsis PDF, Video MP4, or Image)</label>
          <input type="file" class="form-input" id="inputFile" accept="image/*,video/*,application/pdf,.pdf,.mp4,.mov">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCloseModal">Cancel</button>
          <button type="submit" class="btn">Submit Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Seed Journal Entries
    const DEFAULT_ENTRIES = [
      {
        id: "entry-5",
        date: "Saturday, 25th July 2026",
        title: "Interactive Journal App Upgrades & Dashboard Integration Decision",
        paragraphs: [
          "In today's session, we significantly enhanced the project journal software infrastructure to provide a seamless logging experience across mobile and desktop environments. We implemented a real-time header search bar allowing instant keyword filtering across log titles, dates, narrative text, and attached documents (such as college synopsis PDFs). We also engineered a multi-format attachment system supporting PDFs, inline video clips (MP4/MOV), and images, alongside an instant entry deletion feature with persistent device storage clean-up.",
          "To unify project tracking under a single interface, we integrated a dedicated top-level Journal tab into the local Web Dashboard (http://localhost:8050) positioned below the 3D Digital Twin tab. We established a persistent backend JSON storage architecture (journal_entries.json) with REST API endpoints (/api/journal) to ensure all journal entries remain saved permanently across server restarts and sync seamlessly between iPhone PWA devices and the local control dashboard. With full documentation and journal infrastructure locked in place, we finalized the web software phase to transition focus directly to physical 6-DOF robotic arm hardware assembly."
        ]
      },
      {
        id: 'entry-4',
        date: 'Friday, 24th July 2026',
        title: 'Physical Workspace Geometry & Dual-Frame Calibration Decision',
        paragraphs: [
          'In this session, we finalized the physical workspace geometry and perception pipeline in preparation for hardware assembly. We established persistent REST endpoints for saving physical link measurements and servo zero offsets to a persistent configuration file. The Web Dashboard layout was further refined by placing the 3D Digital Twin tab in the final sidebar position, updating its sync status to "Standing By (Awaiting URDF)", and anonymizing all interface text to ensure a clean, presentation-ready capstone interface. Additionally, we added individual "Test Solo" diagnostic buttons to each servo card for single-joint assembly testing and configured Uvicorn live auto-reload on port 8050.',
          'A major focus of this session was establishing the planned workspace coordinate blueprint for the 50cm x 50cm wooden platform (note that currently only the bare wooden board exists; no ArUco markers have been printed or attached yet). We finalized a dual-frame transformation architecture: ArUco Marker ID 2 will be placed at the corner of the platform near the overhead camera pole, establishing a rock-solid World Frame Origin (0,0). This design ensures that every point on the platform map has strictly positive coordinates (X, Y from 0 to 50cm) and prevents the robot arm from casting shadows over the calibration marker. The exact physical mounting position of the Robot Base on the board will be measured and registered in software once physical assembly and mounting is complete, allowing Python to convert vision coordinates into robot-centric vectors before executing Inverse Kinematics calculations. We also generated vector SVG ArUco markers, created a printable 4cm x 4cm HTML sheet, and compiled a step-by-step physical assembly guide.'
        ]
      },
      {
        id: 'entry-3',
        date: 'Thursday, 23rd July 2026',
        title: 'Web Dashboard Construction & Pre-Assembly Preparation Decision',
        paragraphs: [
          'This session focused on transforming the control software into a full-featured, web-based robotic dashboard to support the entire project lifecycle, starting with physical hardware assembly. Built with FastAPI, WebSockets, and a custom warm linen design system, the dashboard provides live joint sliders, zero-jerk S-curve automated routines, and automated serial port detection via the Arduino CLI tool. We integrated live PS5 DualSense controller teleoperation directly into the web browser via the Gamepad API and added a dedicated Kinematic Calibration panel to tune physical link lengths and servo zero offsets in real-time.',
          'To support team integration, a dedicated top-level 3D Digital Twin tab was created to host the 3D URDF simulation model. We implemented individual "Test Solo" diagnostic buttons for single-joint physical assembly testing and generated vector SVG ArUco markers alongside a printable HTML sheet. Finally, we confirmed the Stage 1 environment design—keeping the destination box fixed while randomly placing the sponge block—to establish a clean, high-accuracy baseline before introducing multi-object complexity in Stage 2.'
        ]
      },
      {
        id: 'entry-2',
        date: 'Thursday, 16th July 2026',
        title: 'Capstone Documentation & Setup Visualizations Decision',
        paragraphs: [
          'During this session, attention shifted toward project documentation and presentation materials. We drafted comprehensive prompts for AI generation tools to produce a professional presentation slide deck for the college synopsis defense. Visual design specifications were defined for creating high-impact 3D render prompts depicting the complete dual-camera robotic workbench setup. The synopsis PDF was finalized and submitted to the university department, establishing a clear project schedule across the six-month development timeline.'
        ],
        attachment: {
          name: 'robotic_arm_synopsis.pdf',
          type: 'pdf',
          url: 'robotic%20arm%20synopsis.pdf'
        }
      },
      {
        id: 'entry-1',
        date: 'Monday, 06th July 2026',
        title: 'Architecture Definition & Firmware Foundation Decision',
        paragraphs: [
          'The project began with a thorough architectural review of the 6-DOF robotic arm capstone project. We established the core hybrid perception and control strategy, deciding to isolate vision feature extraction using OpenCV before passing compact coordinate data into a neural network trained via Behavior Cloning. To ensure human teleoperation produces clean, natural motion, we agreed to implement Cartesian Inverse Kinematics driven by a PS5 DualSense controller rather than relying on direct joint manipulation. On the hardware front, we selected lightweight sponge cubes with cardboard-backed ArUco markers to prevent servo stall and eliminate surface warping under variable room lighting.',
          'For safety and embedded control, we designed a dual-layer safety mechanism featuring a physical emergency stop switch alongside a 500ms serial watchdog on the Arduino Uno. Firmware scripts were developed for initial servo zeroing and production binary packet driver execution. Additionally, we resolved a key mechanical assembly strategy: rather than mounting joints strictly straight up at 90 degrees, we decided to mount hardware at physical midpoints to maximize workspace reach, allowing software joint offsets to handle the mathematical mapping seamlessly.'
        ]
      }
    ];

    function getOrdinalSuffix(day) {
      if (day > 3 && day < 21) return 'th';
      switch (day % 10) {
        case 1:  return 'st';
        case 2:  return 'nd';
        case 3:  return 'rd';
        default: return 'th';
      }
    }

    function formatExactDate(d = new Date()) {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      
      const dayName = days[d.getDay()];
      const dayNum = d.getDate();
      const monthName = months[d.getMonth()];
      const year = d.getFullYear();

      const padDay = dayNum < 10 ? `0${dayNum}` : `${dayNum}`;
      return `${dayName}, ${padDay}${getOrdinalSuffix(dayNum)} ${monthName} ${year}`;
    }

    function getStoredEntries() {
      const saved = localStorage.getItem('robotic_arm_journal_entries');
      if (saved) {
        try { return JSON.parse(saved); } catch (e) {}
      }
      return DEFAULT_ENTRIES;
    }

    async function syncBackendJournal() {
      try {
        const res = await fetch('/api/journal');
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            localStorage.setItem('robotic_arm_journal_entries', JSON.stringify(data));
            renderJournal();
          }
        }
      } catch (e) {
        // Backend not available (e.g. static GitHub Pages on mobile data)
      }
    }

    async function commitToGitHub(entries) {
      const pat = localStorage.getItem('github_pat');
      if (!pat) return;
      
      const repoPath = 'SohamBhavsar24/vision-autonomous-robotic-arm';
      const filePath = 'dashboard/backend/journal_entries.json';
      const apiUrl = `https://api.github.com/repos/${repoPath}/contents/${filePath}`;

      try {
        const getRes = await fetch(apiUrl, {
          headers: { Authorization: `token ${pat}` }
        });
        let sha = '';
        if (getRes.ok) {
          const getJson = await getRes.json();
          sha = getJson.sha;
        }

        const contentStr = btoa(unescape(encodeURIComponent(JSON.stringify(entries, null, 2))));
        await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            Authorization: `token ${pat}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Auto-sync journal entry from iPhone App',
            content: contentStr,
            sha: sha || undefined
          })
        });
      } catch (err) {
        console.warn('GitHub API sync error:', err);
      }
    }

    async function saveEntries(entries) {
      localStorage.setItem('robotic_arm_journal_entries', JSON.stringify(entries));
      try {
        await fetch('/api/journal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries })
        });
      } catch (e) {}

      // Direct Cloud GitHub Sync
      commitToGitHub(entries);
    }

    function deleteEntry(id) {
      if (confirm("Are you sure you want to delete this journal entry?")) {
        let entries = getStoredEntries();
        entries = entries.filter(e => e.id !== id);
        saveEntries(entries);
        renderJournal();
      }
    }

    function renderAttachment(att) {
      if (!att) return '';
      if (att.type === 'pdf' || (att.name && att.name.toLowerCase().endsWith('.pdf'))) {
        return `
          <div class="attachment-box">
            <a href="${att.url}" target="_blank" download="${att.name}" class="attachment-badge">
              📄 View / Download PDF: ${att.name}
            </a>
          </div>
        `;
      }
      if (att.type === 'video' || (att.name && (att.name.toLowerCase().endsWith('.mp4') || att.name.toLowerCase().endsWith('.mov')))) {
        return `
          <div class="attachment-box">
            <div class="attachment-badge">📹 Attached Video: ${att.name}</div>
            <video class="attachment-media-video" controls src="${att.url}"></video>
          </div>
        `;
      }
      if (att.type === 'image' || (att.name && (att.name.toLowerCase().endsWith('.png') || att.name.toLowerCase().endsWith('.jpg') || att.name.toLowerCase().endsWith('.jpeg')))) {
        return `
          <div class="attachment-box">
            <div class="attachment-badge">🖼️ Attached Image: ${att.name}</div>
            <br>
            <img class="attachment-media-img" src="${att.url}" alt="${att.name}">
          </div>
        `;
      }
      return `
        <div class="attachment-box">
          <a href="${att.url}" target="_blank" download="${att.name}" class="attachment-badge">
            📎 Download File: ${att.name}
          </a>
        </div>
      `;
    }

    function renderJournal() {
      const container = document.getElementById('journalContainer');
      const entries = getStoredEntries();
      const query = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = entries.filter(item => {
        if (!query) return true;
        const matchTitle = item.title.toLowerCase().includes(query);
        const matchDate = item.date.toLowerCase().includes(query);
        const matchContent = item.paragraphs.some(p => p.toLowerCase().includes(query));
        const matchAttachment = item.attachment && item.attachment.name.toLowerCase().includes(query);
        return matchTitle || matchDate || matchContent || matchAttachment;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">No journal entries found matching "${query}"</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <article class="journal-entry">
          <div class="entry-header-row">
            <div class="entry-date">${item.date}</div>
            <button class="delete-btn" onclick="deleteEntry('${item.id}')" title="Delete Entry">🗑️</button>
          </div>
          <h2 class="entry-title">${item.title}</h2>
          <div class="entry-content">
            ${item.paragraphs.map(p => `<p>${p}</p>`).join('')}
          </div>
          ${renderAttachment(item.attachment)}
        </article>
      `).join('');
    }

    // Live Search Event Listener
    document.getElementById('searchInput').addEventListener('input', renderJournal);

    // Modal Control
    const modalOverlay = document.getElementById('modalOverlay');
    const btnOpenModal = document.getElementById('btnOpenModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const inputDate = document.getElementById('inputDate');
    const journalForm = document.getElementById('journalForm');

    btnOpenModal.addEventListener('click', () => {
      inputDate.value = formatExactDate();
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputText').value = '';
      document.getElementById('inputFile').value = '';
      modalOverlay.style.display = 'flex';
    });

    btnCloseModal.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.style.display = 'none';
    });

    // Handle Form Submit with File Attachment
    journalForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const date = inputDate.value;
      let title = document.getElementById('inputTitle').value.trim();
      const rawText = document.getElementById('inputText').value.trim();
      const fileInput = document.getElementById('inputFile');

      if (!title) {
        title = 'Engineering Progress & Decision Updates';
      }
      if (!title.toLowerCase().endsWith('decision')) {
        title += ' Decision';
      }

      const paragraphs = rawText.split('\n\n').map(p => p.trim()).filter(p => p.length > 0);

      const processAndSave = (attachmentObj = null) => {
        const newEntry = {
          id: `entry-${Date.now()}`,
          date,
          title,
          paragraphs,
          attachment: attachmentObj
        };

        const entries = getStoredEntries();
        entries.unshift(newEntry);
        saveEntries(entries);
        renderJournal();

        modalOverlay.style.display = 'none';
      };

      if (fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
          let type = 'file';
          if (file.type.startsWith('image/')) type = 'image';
          else if (file.type.startsWith('video/')) type = 'video';
          else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) type = 'pdf';

          processAndSave({
            name: file.name,
            type: type,
            url: evt.target.result
          });
        };
        reader.readAsDataURL(file);
      } else {
        processAndSave(null);
      }
    });

    // Auto-Sync with GitHub Pages when app is opened or brought to foreground
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        renderJournal();
      }
    });

    window.addEventListener('focus', () => {
      renderJournal();
    });

    renderJournal();
    syncBackendJournal();
  </script>
</body>
</html>
